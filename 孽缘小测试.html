<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>错线司 · 十幕红线劫</title>
<style>
  :root{
    --paper:#F6F1E7;         /* 宣纸底 */
    --card:#FBF7EE;          /* 卡片纸 */
    --ink:#2B2B2B;           /* 深墨 */
    --ink-light:#8A8175;     /* 浅墨 */
    --cinnabar:#B23A2E;      /* 朱砂 */
    --seal:#A93226;          /* 选中印泥 */
    --teal:#3E5C5A;          /* 黛青 */
    --gold:#C9A45C;          /* 暗金 */
    --serif:"Source Han Serif SC","Noto Serif SC","思源宋体","Songti SC","STSong","SimSun","宋体",serif;
    --kai:"LXGW WenKai","霞鹜文楷","Kaiti SC","STKaiti","KaiTi","楷体",cursive;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(201,164,92,.10), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  .stage{
    position:relative;
    max-width:680px;
    margin:0 auto;
    min-height:100vh;
    padding:24px 22px 56px;
    display:flex;
    flex-direction:column;
  }

  /* 转场：墨晕 + 红线 */
  .ink{
    position:fixed; inset:0; pointer-events:none; z-index:80;
    opacity:0;
    background:
      radial-gradient(circle at 50% 50%, rgba(43,43,43,.0) 0%, rgba(43,43,43,.05) 40%, rgba(43,43,43,.28) 100%);
  }
  .ink.run{ animation:inkfade .45s ease forwards; }
  @keyframes inkfade{
    0%{ opacity:0; transform:scale(.96); }
    45%{ opacity:1; }
    100%{ opacity:0; transform:scale(1.04); }
  }
  .redline{
    position:fixed; left:-40%; bottom:18%; width:70%; height:2px; z-index:81;
    background:linear-gradient(90deg, transparent, var(--cinnabar));
    transform:translateX(0) rotate(-8deg); opacity:0; pointer-events:none;
  }
  .redline.run{ animation:sweep .45s ease forwards; }
  @keyframes sweep{
    0%{ opacity:0; transform:translateX(0) rotate(-8deg); }
    25%{ opacity:.9; }
    100%{ opacity:0; transform:translateX(90vw) rotate(-8deg); }
  }

  .page{ display:none; flex-direction:column; }
  .page.active{ display:flex; animation:pagein .45s ease both; }
  @keyframes pagein{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* 顶部小工具条 */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    color:var(--ink-light); font-size:13px; margin-bottom:8px;
  }
  .sound-toggle{
    border:1px solid rgba(138,129,117,.45); background:transparent;
    color:var(--ink-light); font-family:var(--serif); font-size:12px;
    padding:4px 10px; border-radius:999px; cursor:pointer; letter-spacing:.05em;
  }
  .sound-toggle.on{ color:var(--cinnabar); border-color:var(--cinnabar); }

  /* 封面 */
  .cover{ align-items:center; text-align:center; padding-top:28px; }
  .cover-art{ position:relative; width:230px; height:230px; margin-bottom:6px; }
  .moon{
    position:absolute; inset:14px; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #f3e7ca 0%, #e9d6aa 42%, #d9c086 70%, rgba(217,192,134,.35) 100%);
    box-shadow:0 0 40px rgba(201,164,92,.35), inset 0 0 18px rgba(201,164,92,.4);
    opacity:.92;
  }
  .plaque{
    position:absolute; right:20px; top:64px; width:64px; padding:8px 0 7px;
    background:var(--card); border:1.5px solid var(--ink);
    border-radius:3px; font-family:var(--kai); font-size:15px; letter-spacing:.12em;
    box-shadow:0 3px 0 rgba(43,43,43,.18);
    transform:rotate(4deg);
  }
  .cover h1{
    font-size:40px; letter-spacing:.28em; margin:14px 0 4px; text-indent:.28em;
    font-weight:600; color:var(--ink);
  }
  .cover .sub{
    font-size:19px; letter-spacing:.18em; margin:0 0 10px; color:var(--cinnabar);
    font-family:var(--kai); text-indent:.18em;
  }
  .cover .tagline{ font-size:16px; color:var(--ink); margin:2px 0; }
  .cover .hook{ font-size:14px; color:var(--ink-light); margin:10px 0 26px; letter-spacing:.06em; }
  .cover .disclaimer{
    font-size:11.5px; color:var(--ink-light); opacity:.75; margin-top:14px; letter-spacing:.04em;
  }

  /* 按钮 */
  .btn{
    display:inline-block; cursor:pointer; border:none; font-family:var(--kai);
    letter-spacing:.08em; text-align:center; transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn-primary{
    min-width:210px; padding:15px 34px; font-size:18px;
    color:#fff; background:var(--cinnabar); border-radius:4px;
    animation:breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:translateY(0); box-shadow:0 6px 18px rgba(178,58,46,.18); }
    50%{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(178,58,46,.26); }
  }
  .btn-primary:hover{ transform:translateY(-4px) scale(1.02); }
  .btn-primary:active{ transform:translateY(0) scale(.98); }
  .btn-ghost{
    background:transparent; color:var(--ink-light); border:1px solid rgba(138,129,117,.5);
    padding:11px 24px; font-size:14px; border-radius:4px; margin-top:16px;
  }
  .btn-ghost:hover{ border-color:var(--cinnabar); color:var(--cinnabar); }

  /* 须知 */
  .notice .scroll-title{
    font-size:24px; letter-spacing:.16em; font-weight:600; margin:8px 0 18px; color:var(--ink);
  }
  .notice-card{
    background:var(--card); border:1px solid rgba(138,129,117,.28);
    border-radius:6px; padding:20px 20px 10px; position:relative;
    box-shadow:0 2px 12px rgba(43,43,43,.05);
  }
  .notice-card .roll{
    position:absolute; top:-7px; left:0; right:0; height:14px; margin:0 24px;
    border:1px solid rgba(138,129,117,.35); border-radius:8px; background:var(--paper);
  }
  .notice-item{
    display:flex; gap:12px; padding:12px 0; border-bottom:1px dashed rgba(138,129,117,.3);
    font-size:15.5px; line-height:1.8; color:var(--ink);
  }
  .notice-item:last-child{ border-bottom:none; }
  .notice-item .no{
    flex:none; width:26px; height:26px; border-radius:50%;
    border:1px solid var(--cinnabar); color:var(--cinnabar);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; margin-top:2px; font-family:var(--kai);
  }
  .notice-cta{ display:flex; flex-direction:column; align-items:center; margin-top:26px; }

  /* 进度十盏灯 */
  .lanterns{
    display:flex; justify-content:center; gap:9px; margin:4px 0 20px;
  }
  .lamp{
    width:14px; height:14px; border-radius:50%;
    border:1.5px solid rgba(138,129,117,.55); background:transparent;
    position:relative; transition:all .3s ease;
  }
  .lamp.done{ background:var(--cinnabar); border-color:var(--cinnabar); box-shadow:0 0 8px rgba(178,58,46,.45); }
  .lamp.now{ border-color:var(--cinnabar); box-shadow:0 0 0 3px rgba(178,58,46,.15); }

  /* 题目 */
  .question .scene-no{
    font-family:var(--kai); color:var(--cinnabar); font-size:15px;
    letter-spacing:.16em; margin:0 0 4px;
  }
  .question .scene{ font-size:15px; color:var(--ink-light); line-height:1.85; margin:0 0 6px; }
  .question .ask{ font-size:18px; font-weight:600; line-height:1.7; margin:0 0 20px; color:var(--ink); }
  .options{ display:flex; flex-direction:column; gap:14px; }
  .option{
    position:relative; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid rgba(138,129,117,.32);
    border-left:3px solid var(--cinnabar); border-radius:5px;
    padding:15px 16px 15px 15px; font-family:var(--serif); font-size:15.5px; line-height:1.75;
    color:var(--ink); transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    box-shadow:0 1px 6px rgba(43,43,43,.05);
  }
  .option .tag{
    font-family:var(--kai); color:var(--cinnabar); font-weight:600; margin-right:9px;
  }
  .option:hover{ transform:translateX(2px); border-color:var(--cinnabar); }
  .option:active{ transform:translateY(0) scale(.99); }
  .option.selected{
    transform:translateY(2px); border-color:var(--seal);
    box-shadow:0 3px 12px rgba(169,50,38,.16);
  }
  .option .seal{
    position:absolute; top:-11px; right:-11px; width:36px; height:36px;
    border:2px solid var(--seal); color:var(--seal); border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--kai); font-size:20px; background:var(--card);
    transform:scale(0); transition:transform .2s cubic-bezier(.2,1.6,.4,1);
  }
  .option.selected .seal{ transform:scale(1) rotate(-6deg); }
  .q-foot{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:24px; color:var(--ink-light); font-size:13px;
  }
  .back-link{
    cursor:pointer; color:var(--ink-light); background:none; border:none;
    font-family:var(--serif); font-size:13px; letter-spacing:.05em;
  }
  .back-link:hover{ color:var(--cinnabar); }

  /* 解线中 */
  .loading{ align-items:center; justify-content:center; text-align:center; min-height:72vh; }
  .knot-wrap{ width:120px; height:120px; margin-bottom:26px; position:relative; }
  .knot-ring{
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid rgba(178,58,46,.25);
  }
  .knot-ring::after{
    content:""; position:absolute; inset:12px; border-radius:50%;
    border:1.5px solid rgba(178,58,46,.45); border-top-color:transparent;
    animation:spin 2.4s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading h2{ font-size:24px; letter-spacing:.14em; font-weight:600; margin:0 0 8px; }
  .loading .line-rotor{
    font-family:var(--kai); font-size:15px; color:var(--ink-light);
    min-height:28px; margin:14px 0 0; line-height:1.9;
  }
  .dots span{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--ink-light); margin:0 4px; animation:pulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2){ animation-delay:.2s; }
  .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes pulse{ 0%,100%{ opacity:.25; transform:scale(.8);} 50%{ opacity:1; transform:scale(1.15);} }

  /* 结果 */
  .result{ padding-top:4px; }
  .verdict-scroll{
    background:var(--card); border:1px solid rgba(138,129,117,.3);
    border-radius:6px; padding:24px 22px; position:relative;
    box-shadow:0 3px 18px rgba(43,43,43,.07);
  }
  .verdict-scroll::before,.verdict-scroll::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%);
    width:34px; height:12px; border:1px solid rgba(138,129,117,.4); border-radius:8px;
    background:var(--paper);
  }
  .verdict-scroll::before{ top:-7px; }
  .verdict-scroll::after{ bottom:-7px; }
  .result .kicker{
    font-family:var(--kai); color:var(--cinnabar); font-size:15px;
    letter-spacing:.16em; text-align:center; margin-bottom:14px;
  }
  .result .draw{
    text-align:center; font-size:16px; color:var(--ink); margin:0 0 6px;
  }
  .result .line-name{
    font-size:30px; font-weight:600; letter-spacing:.08em;
    text-align:center; margin:2px 0 18px; color:var(--ink);
  }
  .type-motif{ display:block; margin:10px auto 16px; }
  .verdict-lines{
    border-top:1px solid rgba(138,129,117,.25); border-bottom:1px solid rgba(138,129,117,.25);
    padding:14px 2px; margin-bottom:16px;
  }
  .verdict-lines p{
    margin:0; padding:5px 0; font-size:15.5px; line-height:1.9; color:var(--ink);
    text-align:justify; text-justify:inter-ideograph;
  }
  .verdict-lines p:first-child{ font-size:17px; font-weight:600; }
  .sub-line{
    background:rgba(62,92,90,.07); border-left:3px solid var(--teal);
    border-radius:4px; padding:12px 14px; margin:12px 0 16px;
    font-size:14.5px; line-height:1.85; color:var(--ink);
  }
  .coord{
    display:flex; flex-direction:column; gap:10px; margin:4px 0 16px;
  }
  .coord .row{ display:flex; gap:12px; align-items:baseline; }
  .coord .key{
    flex:none; font-family:var(--kai); color:var(--cinnabar); font-size:14px;
    min-width:52px; letter-spacing:.08em;
  }
  .coord .val{ font-size:14.5px; line-height:1.75; color:var(--ink); }
  .grid-box{
    border:1px solid rgba(201,164,92,.65); background:rgba(201,164,92,.08);
    border-radius:5px; padding:12px 14px; margin:0 0 16px;
  }
  .grid-box .label{ font-family:var(--kai); font-size:13px; color:var(--gold); letter-spacing:.1em; }
  .grid-box .name{ font-size:17px; font-weight:600; margin-top:4px; color:var(--ink); }
  .mirror{
    display:flex; gap:12px; align-items:center; margin:0 0 18px;
    font-size:15px; color:var(--ink);
  }
  .mirror .label{ font-family:var(--kai); color:var(--teal); flex:none; }
  .advice{
    border-top:1px dashed rgba(138,129,117,.4); padding-top:14px;
    font-size:15px; line-height:1.85; color:var(--ink);
  }
  .advice .label{ font-family:var(--kai); color:var(--cinnabar); margin-right:6px; }
  .result-cta{ display:flex; flex-direction:column; align-items:center; margin-top:24px; gap:4px; }
  .result .disclaimer{
    font-size:11.5px; color:var(--ink-light); opacity:.75; text-align:center;
    margin-top:18px; letter-spacing:.04em; line-height:1.7;
  }

  /* 分享卡 */
  .share{ align-items:center; padding-top:12px; }
  .share-card{
    width:100%; max-width:400px; background:var(--card);
    border:2px solid var(--cinnabar); border-radius:8px;
    padding:26px 24px 20px; position:relative; text-align:center;
    box-shadow:0 6px 24px rgba(43,43,43,.12);
  }
  .share-card .corner-seal{
    position:absolute; top:-12px; right:-12px; width:44px; height:44px;
    border:2px solid var(--seal); color:var(--seal); border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--kai); font-size:24px; background:var(--card);
    transform:rotate(6deg);
  }
  .share-card .stitle{ font-family:var(--kai); color:var(--ink-light); font-size:14px; letter-spacing:.12em; }
  .share-card .sline{ font-size:27px; font-weight:600; margin:8px 0 14px; letter-spacing:.06em; }
  .share-card .srow{
    display:flex; justify-content:center; gap:8px; align-items:baseline;
    font-size:14px; color:var(--ink); margin:6px 0;
  }
  .share-card .srow .k{ font-family:var(--kai); color:var(--ink-light); flex:none; }
  .share-card .squote{
    font-size:13.5px; line-height:1.8; color:var(--ink-light); margin:14px 0 4px;
    text-align:justify; text-justify:inter-ideograph;
  }
  .share-card .sfoot{
    margin-top:14px; padding-top:12px; border-top:1px dashed rgba(138,129,117,.4);
    font-size:11.5px; color:var(--ink-light); letter-spacing:.04em;
  }
  .share-cta{ display:flex; flex-direction:column; align-items:center; margin-top:22px; }
  .row-btns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
  @media (max-width:380px){
    .cover h1{ font-size:32px; }
    .option{ font-size:14.5px; }
    .result .line-name{ font-size:25px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="ink" id="ink"></div>
  <div class="redline" id="redline"></div>

  <!-- 封面 -->
  <section class="page active" id="page-cover">
    <div class="topbar">
      <span>错线司 · 十幕红线劫</span>
      <button class="sound-toggle" id="soundToggle" aria-pressed="false">音效 · 关</button>
    </div>
    <div class="cover">
      <div class="cover-art">
        <div class="moon"></div>
        <svg class="knots" viewBox="0 0 230 230" width="230" height="230" aria-hidden="true">
          <path d="M30 150 C65 95, 100 90, 115 125 C128 156, 158 150, 198 108"
            fill="none" stroke="#B23A2E" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="92" cy="116" r="7" fill="none" stroke="#B23A2E" stroke-width="2"/>
          <path d="M85 112 q7 7 0 14 M99 112 q-7 7 0 14" fill="none" stroke="#B23A2E" stroke-width="1.8"/>
          <circle cx="140" cy="136" r="7" fill="none" stroke="#B23A2E" stroke-width="2"/>
          <path d="M133 132 q7 7 0 14 M147 132 q-7 7 0 14" fill="none" stroke="#B23A2E" stroke-width="1.8"/>
          <circle cx="178" cy="110" r="7" fill="none" stroke="#B23A2E" stroke-width="2"/>
          <path d="M171 106 q7 7 0 14 M185 106 q-7 7 0 14" fill="none" stroke="#B23A2E" stroke-width="1.8"/>
        </svg>
        <div class="plaque">错线司</div>
      </div>
      <h1>错线司</h1>
      <p class="sub">十幕红线劫</p>
      <p class="tagline">测一测你最容易被哪种孽缘缠住</p>
      <p class="hook">一炷香，十幕旧缘。凭第一反应落笔。</p>
      <button class="btn btn-primary" id="btnStart">入司问线</button>
      <p class="disclaimer">娱乐化自我探索，非心理诊断</p>
    </div>
  </section>

  <!-- 问线须知 -->
  <section class="page" id="page-notice">
    <div class="topbar">
      <span>问线须知</span>
      <button class="sound-toggle" id="soundToggle2" aria-pressed="false">音效 · 关</button>
    </div>
    <div class="notice">
      <h2 class="scroll-title">问线须知</h2>
      <div class="notice-card">
        <div class="roll"></div>
        <div class="notice-item"><span class="no">一</span><span>没有好缘坏缘，只有你容易反复走入的结构。</span></div>
        <div class="notice-item"><span class="no">二</span><span>每题选最像你的一个，不必选“应该”。</span></div>
        <div class="notice-item"><span class="no">三</span><span>十幕走完，月老会给你主型、副型与一线判词。</span></div>
        <div class="notice-item"><span class="no">四</span><span>本测试仅供自我探索，不替代专业咨询。</span></div>
      </div>
      <div class="notice-cta">
        <button class="btn btn-primary" id="btnBegin">开始问线</button>
        <button class="btn btn-ghost" id="btnBackCover">返回封面</button>
      </div>
    </div>
  </section>

  <!-- 题目 -->
  <section class="page" id="page-question">
    <div class="lanterns" id="lanterns"></div>
    <div class="question" id="question"></div>
    <div class="q-foot">
      <button class="back-link" id="btnPrev">‹ 上一幕</button>
      <span id="qCount">第 1 / 10 幕</span>
    </div>
  </section>

  <!-- 解线中 -->
  <section class="page" id="page-loading">
    <div class="loading">
      <div class="knot-wrap"><div class="knot-ring"></div></div>
      <h2>月老正在解线……</h2>
      <div class="dots"><span></span><span></span><span></span></div>
      <p class="line-rotor" id="lineRotor">第一结：你如何靠近一个人。</p>
    </div>
  </section>

  <!-- 结果 -->
  <section class="page" id="page-result">
    <div class="result" id="result"></div>
  </section>

  <!-- 分享卡 -->
  <section class="page" id="page-share">
    <div class="share">
      <div class="share-card" id="shareCard">
        <div class="corner-seal">缘</div>
        <div class="stitle">我的错线判词</div>
        <div class="sline" id="shareLine"></div>
        <div class="srow"><span class="k">坐标</span><span id="shareCoord"></span></div>
        <div class="srow"><span class="k">文学镜像</span><span id="shareMirror"></span></div>
        <div class="squote" id="shareQuote"></div>
        <div class="sfoot">错线司 · 十幕红线劫｜娱乐化自我探索</div>
      </div>
      <div class="share-cta">
        <div class="row-btns">
          <button class="btn btn-primary" id="btnSave" style="min-width:160px;padding:13px 26px;font-size:15px;">保存判词</button>
          <button class="btn btn-ghost" id="btnRestart2" style="margin-top:0;">再问一次</button>
        </div>
        <button class="btn btn-ghost" id="btnBackResult">返回判词</button>
      </div>
    </div>
  </section>
</div>

<script>
/* ---------- 数据 ---------- */

/* ---------- 状态 ---------- */
let order = [];            // order[q] = 该题选项的显示顺序索引
let answers = [];          // answers[q] = 原始选项索引（相对 QUESTIONS[q].options）

let soundOn = false;
let audioCtx = null;
let resultData = null;

const letters = ["A","B","C","D"];

function shuffle(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function initOrder(){
  order = QUESTIONS.map(q => shuffle(q.options.map((_,i)=>i)));
  answers = new Array(QUESTIONS.length).fill(-1);
}

/* ---------- 页面切换 ---------- */
function transition(cb){
  const ink = document.getElementById("ink");
  const rl = document.getElementById("redline");
  ink.classList.remove("run"); rl.classList.remove("run");
  void ink.offsetWidth; void rl.offsetWidth;
  ink.classList.add("run"); rl.classList.add("run");
  setTimeout(cb, 180);
}

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"});
  try{ window.scrollTo(0,0); }catch(e){}
}

function goto(id){
  transition(()=> showPage(id));
}

/* ---------- 音效 ---------- */
function toggleSound(){
  soundOn = !soundOn;
  const t = soundOn ? "音效 · 开" : "音效 · 关";
  document.querySelectorAll(".sound-toggle").forEach(b=>{
    b.textContent = t;
    b.classList.toggle("on", soundOn);
    b.setAttribute("aria-pressed", String(soundOn));
  });
}

function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  return audioCtx;
}

function playStamp(){
  if(!soundOn) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  // 印章落纸：短促低音
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(90, t+0.12);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.18);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t+0.2);
}

function playPage(){
  if(!soundOn) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  // 纸页轻响：柔和噪声
  const len = Math.floor(ctx.sampleRate*0.22);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++){
    const env = Math.sin(Math.PI*i/len);
    d[i] = (Math.random()*2-1)*0.18*env;
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 0.8;
  src.connect(f).connect(ctx.destination);
  src.start(t);
}

/* ---------- 题目渲染 ---------- */
function renderLanterns(){
  const wrap = document.getElementById("lanterns");
  wrap.innerHTML = "";
  for(let i=0;i<10;i++){
    const s = document.createElement("span");
    s.className = "lamp";
    if(answers[i] >= 0) s.classList.add("done");
    if(i === cur) s.classList.add("now");
    wrap.appendChild(s);
  }
}

function renderQuestion(){
  const q = QUESTIONS[cur];
  const box = document.getElementById("question");
  renderLanterns();
  const opts = order[cur].map(origIdx=>({ origIdx, data:q.options[origIdx] }));
  box.innerHTML =
    '<p class="scene-no">'+q.no+'</p>'+
    '<p class="scene">'+q.scene+'</p>'+
    (q.ask ? '<p class="ask">'+q.ask+'</p>' : '')+
    '<div class="options">'+
      opts.map((o,i)=>{
        const chosen = answers[cur] === o.origIdx;
        return '<button class="option'+(chosen?' selected':'')+'" data-orig="'+o.origIdx+'">'+
          '<span class="seal">缘</span>'+
          '<span class="tag">'+letters[i]+'.</span><span>'+o.data.text+'</span>'+
        '</button>';
      }).join("")+
    '</div>';
  document.getElementById("qCount").textContent = "第 "+(cur+1)+" / 10 幕";
  document.querySelectorAll(".option").forEach(el=>{
    el.addEventListener("click", ()=>{
      const orig = parseInt(el.dataset.orig, 10);
      choose(orig);
    });
  });
}

function choose(origIdx){
  if(answers[cur] >= 0) return; // 防重复
  answers[cur] = origIdx;
  playStamp();
  document.querySelectorAll(".option").forEach(el=>{
    el.classList.remove("selected");
    if(parseInt(el.dataset.orig,10) === origIdx) el.classList.add("selected");
  });
  renderLanterns();
  setTimeout(()=>{
    if(cur < 9){
      cur++;
      playPage();
      transition(()=>renderQuestion());
    } else {
      gotoLoading();
    }
  }, 320);
}

function gotoLoading(){
  showPage("page-loading");
  const rotor = document.getElementById("lineRotor");

}

/* ---------- 计分 ---------- */
function computeResult(){
  const counts = {};       // 每型出现总次数
  const picked = {};       // 用户选中次数
  let sumH = 0, sumV = 0;
  QUESTIONS.forEach(q=>{
    q.options.forEach(o=>{ counts[o.type] = (counts[o.type]||0)+1; });
  });
  answers.forEach((aIdx, qi)=>{
    const o = QUESTIONS[qi].options[aIdx];
    picked[o.type] = (picked[o.type]||0)+1;
    sumH += o.h; sumV += o.v;
  });
  const std = Object.keys(TYPES).map(k=>({
    key:k, score:(picked[k]||0)/(counts[k]||1)
  })).sort((a,b)=> b.score - a.score);
  const main = std[0], sub = std[1];
  const avgH = sumH/10, avgV = sumV/10;

  // 九宫格
  const colH = avgH <= -0.8 ? -1 : (avgH >= 0.8 ? 1 : 0);
  const colV = avgV <= -0.8 ? -1 : (avgV >= 0.8 ? 1 : 0);
  const grid = [
    [ "投射纠缠型",      "反差吸引型",      "混合：控制＋理想化" ],
    [ "混合：融合＋现实", "互相补偿型",      "互相成瘾型" ],
    [ "互相救赎型",      "混合：现实＋旧伤", "强依恋＋强防御" ]
  ][colV+1][colH+1];

  const hText = avgH <= -0.8 ? "你倾向用照顾、融合、拯救来维持关系。"
    : avgH >= 0.8 ? "你倾向用控制、测试、防御、追逃来维持关系。"
    : "你倾向交换、协商、看现实条件。";
  const vText = avgV <= -0.8 ? "你容易被理想化、缺失补偿、心中影像吸引。"
    : avgV >= 0.8 ? "你容易被旧伤重演、熟悉痛苦、强烈拉扯吸引。"
    : "你容易被现实刺激、即时奖赏、条件匹配吸引。";

  const nearTie = (std[0].score - std[1].score) < 0.08;

  resultData = {
    main: TYPES[main.key],
    sub: TYPES[sub.key],
    mainScore: main.score, subScore: sub.score,
    avgH, avgV, grid, hText, vText, nearTie,
    picked, counts
  };
}

function splitVerdict(txt){
  const parts = txt.split("。").map(s=>s.trim()).filter(Boolean);
  if(parts.length >= 2){
    return { head: parts[0]+"。", rest: parts.slice(1).map(s=>s+"。").join("") };
  }
  return { head: txt, rest: "" };
}

  const subTxt = "你的副线是「"+r.sub.line+"」。平时它藏在主型后面；当你压力大、睡不好、被冷落时，最容易滑向这种模式。";
  const mixedNote = r.nearTie
    ? "你落在「混合线」：没有单一主型压倒其他。你更像在不同关系里切换策略。主型与副型很接近，说明你正在从旧模式松动，这是好事。"
    : "";
  const box = document.getElementById("result");
  box.innerHTML =
    '<div class="topbar"><span>结果判词</span>'+
      '<button class="sound-toggle" id="soundToggle3" aria-pressed="'+(soundOn)+'">'+(soundOn?'音效 · 开':'音效 · 关')+'</button></div>'+
    '<div class="verdict-scroll">'+
      '<p class="kicker">你的错线判词</p>'+
      '<p class="draw">你抽到：</p>'+
      '<p class="line-name">「'+r.main.line+'」</p>'+
      motifSVG(r.main.key)+
      '<div class="verdict-lines">'+
        '<p>'+sv.head+'</p>'+
        (sv.rest ? sv.rest.split("。").filter(Boolean).map(s=>'<p>'+s+'。</p>').join("") : "")+
      '</div>'+
      '<div class="sub-line">'+subTxt+'</div>'+
      '<div class="coord">'+
        '<div class="row"><span class="key">你的坐标</span><span class="val">H = '+fmt(r.avgH)+'，V = '+fmt(r.avgV)+'</span></div>'+
        '<div class="row"><span class="key">横向</span><span class="val">'+r.hText+'</span></div>'+
        '<div class="row"><span class="key">纵向</span><span class="val">'+r.vText+'</span></div>'+
      '</div>'+
      '<div class="grid-box"><span class="label">九宫格位置</span><div class="name">你落在「'+r.grid+'」</div></div>'+
      (mixedNote ? '<div class="sub-line" style="border-left-color:var(--gold);background:rgba(201,164,92,.08);">'+mixedNote+'</div>' : "")+
      '<div class="mirror"><span class="label">文学镜像</span><span>'+r.main.mirror+'</span></div>'+
      '<div class="advice"><span class="label">一线建议</span> '+r.main.advice+'</div>'+
    '</div>'+
    '<div class="result-cta">'+
      '<button class="btn btn-primary" id="btnShare">保存判词</button>'+
      '<button class="btn btn-ghost" id="btnRestart">再问一次</button>'+
    '</div>'+
    '<p class="disclaimer">错线司 · 十幕红线劫｜娱乐化自我探索，非心理诊断</p>';
  document.getElementById("btnShare").addEventListener("click", ()=>{ fillShare(); goto("page-share"); });
  document.getElementById("btnRestart").addEventListener("click", restart);
  document.getElementById("soundToggle3").addEventListener("click", toggleSound);
}

function fmt(n){
  const v = Math.round(n*10)/10;
  return (v>0 ? "+" : "") + v.toFixed(1);
}

/* ---------- 分享卡 ---------- */
function fillShare(){
  const r = resultData;
  document.getElementById("shareLine").textContent = "「"+r.main.line+"」";
  document.getElementById("shareCoord").textContent = "H "+fmt(r.avgH)+" / V "+fmt(r.avgV);
  document.getElementById("shareMirror").textContent = r.main.mirror;
  document.getElementById("shareQuote").textContent = r.main.verdict;
}

function saveCard(){
  const r = resultData;
  const W = 720, H = 920;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  // 宣纸底
  x.fillStyle = "#F6F1E7"; x.fillRect(0,0,W,H);
  // 边框
  x.strokeStyle = "#B23A2E"; x.lineWidth = 4;
  x.strokeRect(28,28,W-56,H-56);
  x.strokeStyle = "rgba(178,58,46,.35)"; x.lineWidth = 1;
  x.strokeRect(42,42,W-84,H-84);
  // 印章
  const sx = W-130, sy = 52, sw = 66;
  x.save();
  x.translate(sx+sw/2, sy+sw/2); x.rotate(6*Math.PI/180);
  x.strokeStyle = "#A93226"; x.lineWidth = 3;
  x.strokeRect(-sw/2,-sw/2,sw,sw);
  x.fillStyle = "#A93226"; x.font = "600 42px KaiTi, KaiTi, serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText("缘", 0, 2);
  x.restore();

  x.textAlign = "center";
  x.fillStyle = "#8A8175"; x.font = "22px KaiTi, serif";
  x.fillText("我的错线判词", W/2, 150);
  x.fillStyle = "#2B2B2B"; x.font = "600 48px SimSun, serif";
  x.fillText("「"+r.main.line+"」", W/2, 215);

  // 分隔
  x.strokeStyle = "rgba(138,129,117,.4)"; x.lineWidth = 1;
  x.beginPath(); x.moveTo(90,255); x.lineTo(W-90,255); x.stroke();

  x.textAlign = "left";
  x.fillStyle = "#2B2B2B"; x.font = "28px SimSun, serif";
  x.fillText("坐标  H "+fmt(r.avgH)+" / V "+fmt(r.avgV), 110, 310);
  x.fillText("文学镜像  "+r.main.mirror, 110, 360);
  x.fillText("九宫格  "+r.grid, 110, 410);

  // 判词换行
  x.fillStyle = "#3E5C5A"; x.font = "25px SimSun, serif";
  const maxW = W-220;
  const lines = wrapText(x, r.main.verdict, maxW);
  let ly = 500;
  lines.forEach(l=>{ x.fillText(l, 110, ly); ly += 46; });

  // 建议
  x.strokeStyle = "rgba(138,129,117,.4)";
  x.beginPath(); x.moveTo(110, ly+10); x.lineTo(W-110, ly+10); x.stroke();
  x.fillStyle = "#B23A2E"; x.font = "24px KaiTi, serif";
  x.fillText("一线建议", 110, ly+62);
  x.fillStyle = "#2B2B2B"; x.font = "24px SimSun, serif";
  const advLines = wrapText(x, r.main.advice, maxW);
  let ay = ly+112;
  advLines.forEach(l=>{ x.fillText(l, 110, ay); ay += 42; });

  x.textAlign = "center";
  x.fillStyle = "#8A8175"; x.font = "20px KaiTi, serif";
  x.fillText("错线司 · 十幕红线劫｜娱乐化自我探索", W/2, H-80);

  c.toBlob(b=>{
    if(!b) return;
    const url = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = url;
    a.download = "错线司判词-"+r.main.line+".png";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
  }, "image/png");
}

function wrapText(ctx, text, maxWidth){
  const chars = text.split("");
  const lines = [];
  let line = "";
  for(let ch of chars){
    const test = line + ch;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line); line = ch;
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines;
}

/* ---------- 重来 ---------- */
function restart(){
  initOrder();
  cur = 0;
  resultData = null;
  goto("page-cover");
}

/* ---------- 绑定 ---------- */
document.getElementById("btnStart").addEventListener("click", ()=>{ playPage(); goto("page-notice"); });
document.getElementById("btnBegin").addEventListener("click", ()=>{
  playPage();
  cur = 0;
  transition(()=>{ renderQuestion(); showPage("page-question"); });
});
document.getElementById("btnBackCover").addEventListener("click", ()=> goto("page-cover"));
document.getElementById("btnPrev").addEventListener("click", ()=>{
  if(cur > 0){ cur--; renderQuestion(); }
  else { goto("page-notice"); }
});
document.getElementById("btnRestart2").addEventListener("click", restart);
document.getElementById("btnBackResult").addEventListener("click", ()=> goto("page-result"));
document.getElementById("btnSave").addEventListener("click", ()=>{ playStamp(); saveCard(); });
document.querySelectorAll(".sound-toggle").forEach(b=> b.addEventListener("click", toggleSound));

/* ---------- 启动 ---------- */
initOrder();
renderLanterns();
</script>
